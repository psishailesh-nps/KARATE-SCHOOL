<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admission & Front Office - Jetpur Karate Team ERP</title><link rel="stylesheet" href="assets/css/style.css"><style>
.page{padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px}.field.full{grid-column:1/-1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd;border-radius:8px}.btn{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.actions{display:flex;gap:6px}.badge{padding:4px 8px;border-radius:12px;background:#eee;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;border-radius:14px;padding:22px;max-width:850px;width:100%;max-height:90vh;overflow:auto}@media(max-width:750px){.grid,.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><div class="page">
<div class="page-title"><div><h1>Admission / Front Office</h1><p class="muted">Enquiry, follow-up and student admission management.</p></div><button class="btn primary" onclick="openForm()">+ New Enquiry</button></div>
<div class="cards"><div class="card">Total Enquiries<br><b id="total">0</b></div><div class="card">New<br><b id="newc">0</b></div><div class="card">Follow-up<br><b id="follow">0</b></div><div class="card">Converted<br><b id="converted">0</b></div><div class="card">Lost<br><b id="lost">0</b></div></div>
<div class="panel"><div class="toolbar"><input id="search" placeholder="Search name, mobile, enquiry no..." oninput="render()"><select id="filter" onchange="render()"><option>All</option><option>New</option><option>Follow-up</option><option>Converted</option><option>Lost</option></select></div><div style="overflow:auto"><table class="table"><thead><tr><th>Enquiry No.</th><th>Name</th><th>Mobile</th><th>Interested In</th><th>Follow-up</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="formTitle">New Enquiry</h2><input type="hidden" id="eid"><div class="formgrid">
<div class="field"><label>Student / Enquirer Name *</label><input id="name"></div><div class="field"><label>Mobile *</label><input id="mobile"></div><div class="field"><label>Parent Name</label><input id="parent"></div><div class="field"><label>Age</label><input id="age" type="number"></div><div class="field"><label>Interested Program</label><select id="program"><option>Karate Beginner</option><option>Regular Training</option><option>Kids Karate</option><option>Advanced / Black Belt</option><option>Competition Training</option></select></div><div class="field"><label>Preferred Batch</label><select id="batch"></select></div><div class="field"><label>Enquiry Date</label><input id="date" type="date"></div><div class="field"><label>Next Follow-up</label><input id="next" type="date"></div><div class="field"><label>Status</label><select id="status"><option>New</option><option>Follow-up</option><option>Converted</option><option>Lost</option></select></div><div class="field"><label>Source</label><select id="source"><option>Walk-in</option><option>Phone</option><option>Website</option><option>WhatsApp</option><option>Referral</option><option>Other</option></select></div><div class="field full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div></div><div class="toolbar"><button class="btn primary" onclick="save()">Save</button><button class="btn" onclick="closeForm()">Cancel</button></div></div></div>
<script>
const KEY='jkt_admissions',BKEY='jkt_batches';const $=id=>document.getElementById(id);const arr=()=>JSON.parse(localStorage.getItem(KEY)||'[]');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function seed(){if(arr().length)return;localStorage.setItem(KEY,JSON.stringify([{id:Date.now(),enquiry_no:'ENQ-0001',name:'Rahul Patel',mobile:'',parent:'',age:10,program:'Kids Karate',batch:'',date:new Date().toISOString().slice(0,10),next:'',status:'New',source:'Walk-in',notes:''}]))}
function batches(){let b=JSON.parse(localStorage.getItem(BKEY)||'[]');$('batch').innerHTML='<option value="">Select Batch</option>'+b.filter(x=>x.status!=='Inactive').map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')}
function openForm(id){$('modal').style.display='flex';$('formTitle').textContent=id?'Edit Enquiry':'New Enquiry';$('eid').value=id||'';let x=arr().find(a=>String(a.id)===String(id));$('name').value=x?.name||'';$('mobile').value=x?.mobile||'';$('parent').value=x?.parent||'';$('age').value=x?.age||'';$('program').value=x?.program||'Karate Beginner';$('date').value=x?.date||new Date().toISOString().slice(0,10);$('next').value=x?.next||'';$('status').value=x?.status||'New';$('source').value=x?.source||'Walk-in';$('notes').value=x?.notes||'';batches();setTimeout(()=>{$('batch').value=x?.batch||''},0)}
function closeForm(){$('modal').style.display='none'}
function save(){if(!$('name').value.trim()||!$('mobile').value.trim())return alert('Name and mobile are required.');let a=arr(),id=$('eid').value,x={id:id?Number(id):Date.now(),enquiry_no:id?(a.find(z=>String(z.id)===id)?.enquiry_no):'ENQ-'+String(a.length+1).padStart(4,'0'),name:$('name').value.trim(),mobile:$('mobile').value.trim(),parent:$('parent').value.trim(),age:$('age').value,program:$('program').value,batch:$('batch').value,date:$('date').value,next:$('next').value,status:$('status').value,source:$('source').value,notes:$('notes').value.trim()};if(id)a[a.findIndex(z=>String(z.id)===id)]=x;else a.unshift(x);localStorage.setItem(KEY,JSON.stringify(a));closeForm();render()}
function del(id){if(confirm('Delete this enquiry?')){localStorage.setItem(KEY,JSON.stringify(arr().filter(x=>String(x.id)!==String(id))));render()}}
function convert(id){let a=arr(),x=a.find(z=>String(z.id)===String(id));if(!x)return;if(!confirm('Convert this enquiry into a student admission?'))return;let students=JSON.parse(localStorage.getItem('jkt_students')||'[]');let existing=students.find(s=>String(s.mobile||'').trim()===String(x.mobile||'').trim()&&String(x.mobile||'').trim()!=='');if(existing){alert('A student with this mobile number already exists. The enquiry will be marked Converted.');x.status='Converted';x.converted_student_id=existing.id}else{let code='ST-'+String(students.length+1001).padStart(4,'0');let student={id:Date.now(),student_code:code,first_name:String(x.name||'').split(' ')[0],last_name:String(x.name||'').split(' ').slice(1).join(' '),gender:'',dob:'',mobile:x.mobile,email:'',admission_date:x.date||new Date().toISOString().slice(0,10),belt:'White Belt',batch_id:x.batch||'',status:'Active',address:'',emergency_name:x.parent||'',emergency_mobile:x.mobile};students.unshift(student);localStorage.setItem('jkt_students',JSON.stringify(students));x.status='Converted';x.converted_student_id=student.id;x.converted_student_code=code}localStorage.setItem(KEY,JSON.stringify(a));render()}
function render(){let a=arr(),q=$('search').value.toLowerCase(),f=$('filter').value;let list=a.filter(x=>(f==='All'||x.status===f)&&JSON.stringify(x).toLowerCase().includes(q));$('total').textContent=a.length;$('newc').textContent=a.filter(x=>x.status==='New').length;$('follow').textContent=a.filter(x=>x.status==='Follow-up').length;$('converted').textContent=a.filter(x=>x.status==='Converted').length;$('lost').textContent=a.filter(x=>x.status==='Lost').length;$('rows').innerHTML=list.map(x=>'<tr><td>'+esc(x.enquiry_no)+'</td><td><b>'+esc(x.name)+'</b><br><small>'+esc(x.parent)+'</small></td><td>'+esc(x.mobile)+'</td><td>'+esc(x.program)+'</td><td>'+esc(x.next||'-')+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td><div class="actions"><button class="btn" onclick="openForm('+x.id+')">Edit</button>'+(x.status!=='Converted'?'<button class="btn" onclick="convert('+x.id+')">Convert</button>':'')+'<button class="btn danger" onclick="del('+x.id+')">Delete</button></div></td></tr>').join('')||'<tr><td colspan="7">No enquiries found.</td></tr>'}
seed();batches();render();window.addEventListener('storage',()=>{batches();render()});
</script></body></html>
