<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses & Accounts - Jetpur Karate Team ERP</title><link rel="stylesheet" href="assets/css/style.css"><style>
.page{padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd;border-radius:8px}.btn{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;border-radius:14px;padding:22px;max-width:760px;width:100%;max-height:90vh;overflow:auto}.actions{display:flex;gap:6px}.badge{padding:4px 8px;border-radius:12px;background:#eee;font-size:12px}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="page">
<div class="page-title"><div><h1>Expenses & Accounts</h1><p class="muted">Track academy expenses, coach payments and other outgoing transactions.</p></div><button class="btn primary" onclick="openForm()">+ Add Expense</button></div>
<div class="cards"><div class="card">Total Expenses<br><b id="total">₹0</b></div><div class="card">This Month<br><b id="month">₹0</b></div><div class="card">Coach Payments<br><b id="coach">₹0</b></div><div class="card">Other Expenses<br><b id="other">₹0</b></div></div>
<div class="panel"><div class="toolbar"><input id="search" placeholder="Search title, category, payee..." oninput="render()"><select id="filter" onchange="render()"><option>All</option><option>Coach Salary</option><option>Rent</option><option>Equipment</option><option>Tournament</option><option>Utilities</option><option>Marketing</option><option>Travel</option><option>Other</option></select><button class="btn" onclick="window.print()">Print</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Expense No.</th><th>Date</th><th>Title</th><th>Category</th><th>Payee</th><th>Payment</th><th>Amount</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="formTitle">Add Expense</h2><input type="hidden" id="eid"><div class="formgrid">
<div class="field"><label>Expense Title *</label><input id="title"></div><div class="field"><label>Date *</label><input id="date" type="date"></div>
<div class="field"><label>Category</label><select id="category"><option>Coach Salary</option><option>Rent</option><option>Equipment</option><option>Tournament</option><option>Utilities</option><option>Marketing</option><option>Travel</option><option>Other</option></select></div>
<div class="field"><label>Payee / Coach</label><input id="payee"></div><div class="field"><label>Amount *</label><input id="amount" type="number" min="0" step="0.01"></div><div class="field"><label>Payment Method</label><select id="method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Other</option></select></div>
<div class="field"><label>Reference No.</label><input id="ref"></div><div class="field"><label>Status</label><select id="status"><option>Paid</option><option>Pending</option><option>Cancelled</option></select></div><div class="field full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div></div><div class="toolbar"><button class="btn primary" onclick="save()">Save</button><button class="btn" onclick="closeForm()">Cancel</button></div></div></div>
<script>
const KEY='jkt_expenses', $=id=>document.getElementById(id), arr=()=>JSON.parse(localStorage.getItem(KEY)||'[]'), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function seed(){if(arr().length)return;localStorage.setItem(KEY,JSON.stringify([{id:Date.now(),expense_no:'EXP-0001',title:'Academy Equipment',date:new Date().toISOString().slice(0,10),category:'Equipment',payee:'',amount:2500,method:'UPI',ref:'',status:'Paid',notes:'Demo record'}]))}
function openForm(id){$('modal').style.display='flex';$('formTitle').textContent=id?'Edit Expense':'Add Expense';$('eid').value=id||'';let x=arr().find(a=>String(a.id)===String(id));$('title').value=x?.title||'';$('date').value=x?.date||new Date().toISOString().slice(0,10);$('category').value=x?.category||'Equipment';$('payee').value=x?.payee||'';$('amount').value=x?.amount||'';$('method').value=x?.method||'Cash';$('ref').value=x?.ref||'';$('status').value=x?.status||'Paid';$('notes').value=x?.notes||''}
function closeForm(){$('modal').style.display='none'}
function save(){if(!$('title').value.trim()||!$('amount').value)return alert('Title and amount are required.');let a=arr(),id=$('eid').value,old=id&&a.find(z=>String(z.id)===id);let x={id:id?Number(id):Date.now(),expense_no:old?.expense_no||'EXP-'+String(a.length+1).padStart(4,'0'),title:$('title').value.trim(),date:$('date').value,category:$('category').value,payee:$('payee').value.trim(),amount:Number($('amount').value),method:$('method').value,ref:$('ref').value.trim(),status:$('status').value,notes:$('notes').value.trim()};if(id)a[a.findIndex(z=>String(z.id)===id)]=x;else a.unshift(x);localStorage.setItem(KEY,JSON.stringify(a));closeForm();render()}
function del(id){if(confirm('Delete this expense?')){localStorage.setItem(KEY,JSON.stringify(arr().filter(x=>String(x.id)!==String(id))));render()}}
function render(){let a=arr(),q=$('search').value.toLowerCase(),f=$('filter').value,paid=a.filter(x=>x.status==='Paid');let list=a.filter(x=>(f==='All'||x.category===f)&&JSON.stringify(x).toLowerCase().includes(q));let now=new Date(),ym=now.toISOString().slice(0,7);$('total').textContent='₹'+paid.reduce((s,x)=>s+Number(x.amount||0),0).toLocaleString('en-IN');$('month').textContent='₹'+paid.filter(x=>x.date?.slice(0,7)===ym).reduce((s,x)=>s+Number(x.amount||0),0).toLocaleString('en-IN');$('coach').textContent='₹'+paid.filter(x=>x.category==='Coach Salary').reduce((s,x)=>s+Number(x.amount||0),0).toLocaleString('en-IN');$('other').textContent='₹'+paid.filter(x=>x.category!=='Coach Salary').reduce((s,x)=>s+Number(x.amount||0),0).toLocaleString('en-IN');$('rows').innerHTML=list.map(x=>'<tr><td>'+esc(x.expense_no)+'</td><td>'+esc(x.date)+'</td><td><b>'+esc(x.title)+'</b></td><td><span class="badge">'+esc(x.category)+'</span></td><td>'+esc(x.payee||'-')+'</td><td>'+esc(x.method)+'</td><td>₹'+Number(x.amount||0).toLocaleString('en-IN')+'<br><small>'+esc(x.status)+'</small></td><td><div class="actions"><button class="btn" onclick="openForm('+x.id+')">Edit</button><button class="btn danger" onclick="del('+x.id+')">Delete</button></div></td></tr>').join('')||'<tr><td colspan="8">No expenses found.</td></tr>'}
seed();render();window.addEventListener('storage',render);
</script></body></html>
