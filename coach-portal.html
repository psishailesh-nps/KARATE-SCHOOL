<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Portal - Jetpur Karate Team</title><link rel="stylesheet" href="assets/css/style.css"><style>.page{padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.loginbox{max-width:430px;margin:70px auto}.field{margin:12px 0}.field label{display:block;font-weight:600;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:8px}.btn{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{padding:9px 13px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer}.tabs button.active{background:#2563eb;color:#fff}</style></head><body><div id="app"></div><script>
const $=id=>document.getElementById(id), coaches=()=>JSON.parse(localStorage.getItem('jkt_coaches')||'[]'),students=()=>JSON.parse(localStorage.getItem('jkt_students')||'[]'),batches=()=>JSON.parse(localStorage.getItem('jkt_batches')||'[]'),attendance=()=>JSON.parse(localStorage.getItem('jkt_attendance')||'{}'),exams=()=>JSON.parse(localStorage.getItem('jkt_exams')||'[]'),tournaments=()=>JSON.parse(localStorage.getItem('jkt_tournaments')||'[]');let cid=localStorage.getItem('jkt_coach_portal_id')||'',tab='overview';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function login(){$('app').innerHTML='<div class="card loginbox"><h2>🥋 Coach Portal</h2><p class="muted">Enter your Coach ID and registered mobile.</p><div class="field"><label>Coach ID</label><input id="coachId" placeholder="COA-001"></div><div class="field"><label>Mobile</label><input id="mobile"></div><button class="btn primary" onclick="doLogin()">Login</button><p id="err" style="color:#b42318"></p></div>'}
function doLogin(){let id=$('coachId').value.trim().toLowerCase(),m=$('mobile').value.trim(),c=coaches().find(x=>String(x.coach_code||x.code).toLowerCase()===id&&String(x.mobile||'')===m);if(!c){$('err').textContent='Coach ID or mobile number is incorrect.';return}cid=c.id;localStorage.setItem('jkt_coach_portal_id',cid);tab='overview';render()}
function current(){return coaches().find(x=>String(x.id)===String(cid))}
function logout(){localStorage.removeItem('jkt_coach_portal_id');cid='';render()}
function render(){let c=current();if(!c){login();return}let ss=students().filter(s=>String(s.coach_id)===String(c.id)),e=exams(),t=tournaments();let tabs='<button class="'+(tab==='overview'?'active':'')+'" onclick="tab=\'overview\';render()">Overview</button><button class="'+(tab==='students'?'active':'')+'" onclick="tab=\'students\';render()">Students</button><button class="'+(tab==='attendance'?'active':'')+'" onclick="tab=\'attendance\';render()">Attendance</button><button class="'+(tab==='exams'?'active':'')+'" onclick="tab=\'exams\';render()">Exams</button><button class="'+(tab==='tournaments'?'active':'')+'" onclick="tab=\'tournaments\';render()">Tournaments</button>';$('app').innerHTML='<div class="page"><div class="page-title"><div><h1>Welcome, '+esc(c.name||c.coach_name||'Coach')+'</h1><div class="muted">Coach Portal</div></div><button class="btn" onclick="logout()">Logout</button></div><div class="cards"><div class="card">Coach ID<br><b>'+esc(c.coach_code||c.code||'-')+'</b></div><div class="card">Assigned Students<br><b>'+ss.length+'</b></div><div class="card">Specialization<br><b>'+esc(c.specialization||'-')+'</b></div><div class="card">Experience<br><b>'+esc(c.experience||'-')+' years</b></div></div><div class="tabs">'+tabs+'</div><div class="panel">'+content(c,ss,e,t)+'</div></div>'}
function content(c,ss,e,t){if(tab==='overview')return '<h2>Coach Profile</h2><table class="table"><tr><th>Name</th><td>'+esc(c.name||c.coach_name)+'</td></tr><tr><th>Mobile</th><td>'+esc(c.mobile||'-')+'</td></tr><tr><th>Email</th><td>'+esc(c.email||'-')+'</td></tr><tr><th>Specialization</th><td>'+esc(c.specialization||'-')+'</td></tr></table>';if(tab==='students')return '<h2>Assigned Students</h2>'+tbl(ss,['student_code','first_name','last_name','belt','status']);if(tab==='attendance'){let a=attendance(),rows=[];Object.keys(a).sort().reverse().slice(0,30).forEach(d=>{let day=a[d]||{};ss.forEach(s=>{if(day[s.id])rows.push({date:d,student:s.first_name+' '+(s.last_name||''),status:day[s.id]})})});return '<h2>Recent Attendance</h2>'+tbl(rows,['date','student','status'])}if(tab==='exams')return '<h2>Exam / Grading Records</h2>'+tbl(e.filter(x=>String(x.coach||x.examiner)===String(c.id)),['exam_name','date','target_belt','marks','result']);return '<h2>Tournament Records</h2>'+tbl(t.filter(x=>String(x.coach||x.manager)===String(c.id)),['tournament_name','date','event','result','position'])}
function tbl(data,cols){if(!data.length)return '<p class="muted">No records available.</p>';return '<div style="overflow:auto"><table class="table"><tr>'+cols.map(c=>'<th>'+esc(c.replaceAll('_',' '))+'</th>').join('')+'</tr>'+data.map(x=>'<tr>'+cols.map(c=>'<td>'+esc(x[c]??'-')+'</td>').join('')+'</tr>').join('')+'</table></div>'}
render();
</script></body></html>
