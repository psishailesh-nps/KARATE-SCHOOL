<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings - Jetpur Karate Team ERP</title><link rel="stylesheet" href="assets/css/style.css"><style>
.page{padding:24px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #eee;border-radius:12px;padding:20px;margin-bottom:18px}.field{margin-bottom:14px}.field label{display:block;font-weight:600;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px}.btn{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.muted{color:#666}.userrow{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.badge{padding:4px 8px;border-radius:12px;background:#eee;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:750px){.grid{grid-template-columns:1fr}.userrow{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="page"><h1>⚙️ Settings</h1><p class="muted">Academy profile, login users, roles and Local Storage data management.</p>
<div class="grid"><div class="panel"><h2>🏫 Academy Profile</h2><div class="field"><label>Academy Name</label><input id="academyName"></div><div class="field"><label>Mobile</label><input id="mobile"></div><div class="field"><label>Email</label><input id="email"></div><div class="field"><label>Address</label><textarea id="address" rows="3"></textarea></div><div class="field"><label>Website</label><input id="website"></div><button class="btn primary" onclick="saveProfile()">Save Profile</button></div>
<div class="panel"><h2>👥 Add User / Role</h2><div class="field"><label>Name *</label><input id="uname"></div><div class="field"><label>Username *</label><input id="username"></div><div class="field"><label>Password *</label><input id="password" type="password"></div><div class="field"><label>Role</label><select id="role"><option>Super Admin</option><option>Academy Admin</option><option>Coach</option><option>Student / Parent</option></select></div><button class="btn primary" onclick="addUser()">Add User</button></div></div>
<div class="panel"><h2>👤 User Management</h2><div id="users"></div></div>
<div class="panel"><h2>💾 Local Storage Management</h2><p class="muted">This ERP stores data only in this browser/device.</p><div class="actions"><button class="btn" onclick="exportData()">Export Backup</button><button class="btn" onclick="document.getElementById('file').click()">Import Backup</button><input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)"><button class="btn danger" onclick="clearAll()">Clear ERP Data</button></div></div>
</div><script>
const profileKey='jkt_settings',userKey='jkt_users';
const $=id=>document.getElementById(id);
function loadProfile(){let p=JSON.parse(localStorage.getItem(profileKey)||'{}');$('academyName').value=p.academyName||'Jetpur Karate Team';$('mobile').value=p.mobile||'';$('email').value=p.email||'';$('address').value=p.address||'';$('website').value=p.website||''}
function saveProfile(){localStorage.setItem(profileKey,JSON.stringify({academyName:$('academyName').value.trim()||'Jetpur Karate Team',mobile:$('mobile').value.trim(),email:$('email').value.trim(),address:$('address').value.trim(),website:$('website').value.trim()}));alert('Academy profile saved.')}
function users(){return JSON.parse(localStorage.getItem(userKey)||'[]')}
function seed(){if(users().length)return;localStorage.setItem(userKey,JSON.stringify([{id:1,name:'Super Admin',username:'admin',password:'admin123',role:'Super Admin',status:'Active'}]))}
function addUser(){let name=$('uname').value.trim(),u=$('username').value.trim(),pw=$('password').value;if(!name||!u||!pw)return alert('Name, username and password are required.');let a=users();if(a.some(x=>x.username.toLowerCase()===u.toLowerCase()))return alert('Username already exists.');a.push({id:Date.now(),name,username:u,password:pw,role:$('role').value,status:'Active'});localStorage.setItem(userKey,JSON.stringify(a));$('uname').value=$('username').value=$('password').value='';renderUsers()}
function renderUsers(){let a=users();$('users').innerHTML=a.map(x=>'<div class="userrow"><div><b>'+esc(x.name)+'</b><br><span class="muted">@'+esc(x.username)+'</span> <span class="badge">'+esc(x.role)+'</span></div><div>'+ (x.username==='admin'?'<span class="muted">Default account</span>':'<button class="btn danger" onclick="delUser('+x.id+')">Delete</button>')+'</div></div>').join('')}
function delUser(id){if(confirm('Delete this user?')){localStorage.setItem(userKey,JSON.stringify(users().filter(x=>x.id!==id)));renderUsers()}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])}
function exportData(){let keys=['jkt_settings','jkt_users','jkt_students','jkt_batches','jkt_coaches','jkt_attendance','jkt_fees','jkt_belt_promotions','jkt_exams','jkt_tournaments','jkt_certificates'];let out={exported_at:new Date().toISOString()};keys.forEach(k=>{let v=localStorage.getItem(k);if(v!==null)out[k]=JSON.parse(v)});let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jetpur-karate-team-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);Object.keys(d).filter(k=>k.startsWith('jkt_')).forEach(k=>localStorage.setItem(k,JSON.stringify(d[k])));loadProfile();seed();renderUsers();alert('Backup imported successfully.')}catch(x){alert('Invalid backup file.')}};r.readAsText(f)}
function clearAll(){if(!confirm('This will delete all ERP Local Storage data from this browser. Continue?'))return;Object.keys(localStorage).filter(k=>k.startsWith('jkt_')).forEach(k=>localStorage.removeItem(k));seed();loadProfile();renderUsers();alert('ERP data cleared. Default admin restored.')}
seed();loadProfile();renderUsers();
</script></body></html>
