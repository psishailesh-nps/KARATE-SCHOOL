<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notices & Events - Jetpur Karate Team ERP</title><link rel="stylesheet" href="assets/css/style.css"><style>
.page{padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd;border-radius:8px}.btn{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;border-radius:14px;padding:22px;max-width:780px;width:100%;max-height:90vh;overflow:auto}.actions{display:flex;gap:6px}.badge{padding:4px 8px;border-radius:12px;background:#eee;font-size:12px}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="page">
<div class="page-title"><div><h1>Notices & Events</h1><p class="muted">Manage academy announcements, holidays, grading days and tournaments.</p></div><button class="btn primary" onclick="openForm()">+ New Notice / Event</button></div>
<div class="cards"><div class="card">Total Records<br><b id="total">0</b></div><div class="card">Upcoming Events<br><b id="upcoming">0</b></div><div class="card">Published<br><b id="published">0</b></div><div class="card">Drafts<br><b id="draft">0</b></div></div>
<div class="panel"><div class="toolbar"><input id="search" placeholder="Search title, venue, message..." oninput="render()"><select id="filter" onchange="render()"><option>All</option><option>Notice</option><option>Event</option><option>Holiday</option><option>Exam / Grading</option><option>Tournament</option></select><button class="btn" onclick="window.print()">Print</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Type</th><th>Title</th><th>Date</th><th>Venue</th><th>Audience</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="formTitle">New Notice / Event</h2><input type="hidden" id="eid"><div class="formgrid">
<div class="field"><label>Type</label><select id="type"><option>Notice</option><option>Event</option><option>Holiday</option><option>Exam / Grading</option><option>Tournament</option></select></div><div class="field"><label>Title *</label><input id="title"></div>
<div class="field"><label>Date *</label><input id="date" type="date"></div><div class="field"><label>Time</label><input id="time" type="time"></div>
<div class="field"><label>Venue</label><input id="venue"></div><div class="field"><label>Audience</label><select id="audience"><option>All</option><option>Students</option><option>Parents</option><option>Coaches</option><option>Specific Batch</option></select></div>
<div class="field"><label>Status</label><select id="status"><option>Published</option><option>Draft</option></select></div><div class="field"><label>Contact / Coordinator</label><input id="contact"></div>
<div class="field full"><label>Message / Details</label><textarea id="message" rows="5"></textarea></div></div><div class="toolbar"><button class="btn primary" onclick="save()">Save</button><button class="btn" onclick="closeForm()">Cancel</button></div></div></div>
<script>
const KEY='jkt_notices_events',$=id=>document.getElementById(id),arr=()=>JSON.parse(localStorage.getItem(KEY)||'[]'),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function seed(){if(arr().length)return;localStorage.setItem(KEY,JSON.stringify([{id:Date.now(),type:'Notice',title:'Welcome to Jetpur Karate Team',date:new Date().toISOString().slice(0,10),time:'',venue:'Academy',audience:'All',status:'Published',contact:'',message:'Regular training schedule and academy updates will be posted here.'}]))}
function openForm(id){$('modal').style.display='flex';$('formTitle').textContent=id?'Edit Notice / Event':'New Notice / Event';$('eid').value=id||'';let x=arr().find(a=>String(a.id)===String(id));$('type').value=x?.type||'Notice';$('title').value=x?.title||'';$('date').value=x?.date||new Date().toISOString().slice(0,10);$('time').value=x?.time||'';$('venue').value=x?.venue||'';$('audience').value=x?.audience||'All';$('status').value=x?.status||'Published';$('contact').value=x?.contact||'';$('message').value=x?.message||''}
function closeForm(){$('modal').style.display='none'}
function save(){if(!$('title').value.trim()||!$('date').value)return alert('Title and date are required.');let a=arr(),id=$('eid').value,old=id&&a.find(z=>String(z.id)===id),x={id:id?Number(id):Date.now(),type:$('type').value,title:$('title').value.trim(),date:$('date').value,time:$('time').value,venue:$('venue').value.trim(),audience:$('audience').value,status:$('status').value,contact:$('contact').value.trim(),message:$('message').value.trim()};if(id)a[a.findIndex(z=>String(z.id)===id)]=x;else a.unshift(x);localStorage.setItem(KEY,JSON.stringify(a));closeForm();render()}
function del(id){if(confirm('Delete this record?')){localStorage.setItem(KEY,JSON.stringify(arr().filter(x=>String(x.id)!==String(id))));render()}}
function render(){let a=arr(),q=$('search').value.toLowerCase(),f=$('filter').value,today=new Date().toISOString().slice(0,10),list=a.filter(x=>(f==='All'||x.type===f)&&JSON.stringify(x).toLowerCase().includes(q));$('total').textContent=a.length;$('upcoming').textContent=a.filter(x=>x.date>=today&&x.status==='Published').length;$('published').textContent=a.filter(x=>x.status==='Published').length;$('draft').textContent=a.filter(x=>x.status==='Draft').length;$('rows').innerHTML=list.map(x=>'<tr><td><span class="badge">'+esc(x.type)+'</span></td><td><b>'+esc(x.title)+'</b><br><small>'+esc(x.message).slice(0,70)+'</small></td><td>'+esc(x.date)+(x.time?' '+esc(x.time):'')+'</td><td>'+esc(x.venue||'-')+'</td><td>'+esc(x.audience)+'</td><td>'+esc(x.status)+'</td><td><div class="actions"><button class="btn" onclick="openForm('+x.id+')">Edit</button><button class="btn danger" onclick="del('+x.id+')">Delete</button></div></td></tr>').join('')||'<tr><td colspan="7">No records found.</td></tr>'}
seed();render();window.addEventListener('storage',render);
</script></body></html>
