<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournaments & Achievements - Jetpur Karate Team ERP</title><link rel="stylesheet" href="assets/css/style.css">
<style>
.page{padding:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.form-grid input,.form-grid select,.form-grid textarea{padding:10px;border:1px solid #ddd;border-radius:8px}.toolbar input{flex:1;min-width:220px}.btn{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:left}.badge{padding:4px 9px;border-radius:999px}.gold{background:#fff3cd}.silver{background:#e3f2fd}.bronze{background:#f3e8dc}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-card{background:#fff;border-radius:12px;padding:22px;max-width:720px;width:100%;max-height:90vh;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid textarea{grid-column:1/-1;min-height:80px}.close{float:right;background:none;border:0;font-size:22px}.actions{display:flex;gap:8px;margin-top:15px}.summary{display:flex;gap:12px;flex-wrap:wrap}.card{padding:14px 20px;border:1px solid #eee;border-radius:10px;min-width:120px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="page">
<h1>Tournaments & Achievements</h1><p>Manage student tournament participation, results and achievements using Local Storage.</p>
<div class="summary"><div class="card">Entries<br><b id="total">0</b></div><div class="card">Gold<br><b id="gold">0</b></div><div class="card">Silver<br><b id="silver">0</b></div><div class="card">Bronze<br><b id="bronze">0</b></div></div>
<div class="toolbar"><input id="search" placeholder="Search tournament, student or event"><select id="filter"><option value="">All Medals</option><option>Gold</option><option>Silver</option><option>Bronze</option><option>Participation</option><option>Other</option></select><button class="btn primary" onclick="openForm()">+ Add Achievement</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>Tournament</th><th>Student</th><th>Date</th><th>Event</th><th>Category</th><th>Result</th><th>Position</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<div id="modal" class="modal"><div class="modal-card"><button class="close" onclick="closeForm()">×</button><h2 id="title">Add Achievement</h2>
<form id="form"><input type="hidden" id="id"><div class="form-grid">
<input id="tournament" placeholder="Tournament Name *" required><select id="student" required><option value="">Select Student *</option></select>
<input id="date" type="date" required><input id="location" placeholder="Location">
<input id="eventName" placeholder="Event / Discipline *" required><input id="category" placeholder="Category / Weight">
<select id="result"><option>Participation</option><option>Gold</option><option>Silver</option><option>Bronze</option><option>Other</option></select>
<input id="position" placeholder="Position / Rank"><input id="coach" placeholder="Coach / Manager">
<input id="opponent" placeholder="Opponent (optional)"><input id="score" placeholder="Score / Result Details">
<textarea id="notes" placeholder="Achievement details / Notes"></textarea>
</div><div class="actions"><button class="btn primary">Save Achievement</button><button type="button" class="btn" onclick="closeForm()">Cancel</button></div></form></div></div>
<script>
const KEY='jkt_tournaments',SK='jkt_students';
function data(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function students(){return JSON.parse(localStorage.getItem(SK)||'[]')}
function save(a){localStorage.setItem(KEY,JSON.stringify(a));render()}
function name(id){let s=students().find(x=>String(x.id)===String(id));return s?s.first_name+' '+(s.last_name||''):'Unknown'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let a=data().sort((x,y)=>String(y.date).localeCompare(String(x.date))),q=search.value.toLowerCase(),f=filter.value;total.textContent=a.length;gold.textContent=a.filter(x=>x.result==='Gold').length;silver.textContent=a.filter(x=>x.result==='Silver').length;bronze.textContent=a.filter(x=>x.result==='Bronze').length;let list=a.filter(x=>(!f||x.result===f)&&((x.tournament+' '+name(x.student_id)+' '+x.event_name+' '+(x.category||'')).toLowerCase().includes(q)));rows.innerHTML=list.map(x=>'<tr><td>'+esc(x.tournament)+'</td><td>'+esc(name(x.student_id))+'</td><td>'+esc(x.date)+'</td><td>'+esc(x.event_name)+'</td><td>'+esc(x.category||'-')+'</td><td><span class="badge '+x.result.toLowerCase()+'">'+esc(x.result)+'</span></td><td>'+esc(x.position||'-')+'</td><td><button class="btn" onclick="edit('+x.id+')">Edit</button> <button class="btn" onclick="report('+x.id+')">Report</button> <button class="btn danger" onclick="del('+x.id+')">Delete</button></td></tr>').join('')||'<tr><td colspan="8">No achievements found.</td></tr>'}
function fill(){student.innerHTML='<option value="">Select Student *</option>'+students().filter(s=>s.status!=='Inactive').map(s=>'<option value="'+s.id+'">'+esc(s.student_code+' - '+name(s.id))+'</option>').join('')}
function openForm(x){form.reset();fill();id.value=x?.id||'';title.textContent=x?'Edit Achievement':'Add Achievement';date.value=x?.date||new Date().toISOString().slice(0,10);if(x){tournament.value=x.tournament;student.value=x.student_id;location.value=x.location||'';eventName.value=x.event_name;category.value=x.category||'';result.value=x.result;position.value=x.position||'';coach.value=x.coach||'';opponent.value=x.opponent||'';score.value=x.score||'';notes.value=x.notes||''}modal.classList.add('show')}
function closeForm(){modal.classList.remove('show')}
function edit(i){openForm(data().find(x=>x.id==i))}
function del(i){if(confirm('Delete this achievement?'))save(data().filter(x=>x.id!=i))}
form.onsubmit=e=>{e.preventDefault();let a=data(),x={id:id.value?Number(id.value):Date.now(),tournament:tournament.value.trim(),student_id:student.value,date:date.value,location:location.value.trim(),event_name:eventName.value.trim(),category:category.value.trim(),result:result.value,position:position.value.trim(),coach:coach.value.trim(),opponent:opponent.value.trim(),score:score.value.trim(),notes:notes.value.trim()};let i=a.findIndex(v=>v.id==x.id);i>=0?a[i]=x:a.push(x);save(a);closeForm()}
function report(i){let x=data().find(v=>v.id==i),w=window.open('','_blank','width=700,height=800');w.document.write('<html><head><title>Achievement Report</title><style>body{font-family:Arial;padding:35px}h1,h2{text-align:center}table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #ddd}.r{text-align:right}</style></head><body><h1>JETPUR KARATE TEAM</h1><h2>TOURNAMENT ACHIEVEMENT</h2><table><tr><td>Tournament</td><td class="r">'+esc(x.tournament)+'</td></tr><tr><td>Student</td><td class="r">'+esc(name(x.student_id))+'</td></tr><tr><td>Date</td><td class="r">'+esc(x.date)+'</td></tr><tr><td>Location</td><td class="r">'+esc(x.location||'-')+'</td></tr><tr><td>Event</td><td class="r">'+esc(x.event_name)+'</td></tr><tr><td>Category</td><td class="r">'+esc(x.category||'-')+'</td></tr><tr><td>Result</td><td class="r">'+esc(x.result)+'</td></tr><tr><td>Position</td><td class="r">'+esc(x.position||'-')+'</td></tr><tr><td>Coach</td><td class="r">'+esc(x.coach||'-')+'</td></tr></table><h3>Details</h3><p>'+esc(x.notes||'No additional details')+'</p><p style="margin-top:70px">Authorized Signature: __________________</p><script>window.print()<\/script></body></html>');w.document.close()}
search.oninput=render;filter.onchange=render;render();
</script></body></html>
