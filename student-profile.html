<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Profile - Jetpur Karate Team</title><link rel="stylesheet" href="assets/css/style.css"><style>.page{max-width:1100px;margin:auto;padding:24px}.profile{display:grid;grid-template-columns:180px 1fr;gap:24px}.avatar{width:150px;height:150px;border-radius:16px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:52px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{padding:12px;border:1px solid #eee;border-radius:10px}.item small{display:block;color:#777;margin-bottom:4px}.toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:18px}.btn{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}@media(max-width:700px){.profile,.grid{grid-template-columns:1fr}}@media print{.toolbar{display:none}.page{padding:0}}</style></head><body><div class="page"><div class="toolbar"><button class="btn" onclick="location.href='students.html'">← Students</button><button class="btn primary" onclick="window.print()">Print Profile</button></div><div id="app"></div></div><script>
const id=new URLSearchParams(location.search).get('id');const students=JSON.parse(localStorage.getItem('jkt_students')||'[]');const batches=JSON.parse(localStorage.getItem('jkt_batches')||'[]');const belts=JSON.parse(localStorage.getItem('jkt_belt_promotions')||'[]');const exams=JSON.parse(localStorage.getItem('jkt_exams')||'[]');const tournaments=JSON.parse(localStorage.getItem('jkt_tournaments')||'[]');const certs=JSON.parse(localStorage.getItem('jkt_certificates')||'[]');const s=students.find(x=>String(x.id)===String(id));const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const batch=(batches.find(x=>String(x.id)===String(s?.batch_id))||{}).name||'-';if(!s){document.getElementById('app').innerHTML='<div class="card"><h2>Student not found</h2></div>'}else{let name=(s.first_name||'')+' '+(s.last_name||''), initials=name.trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();document.getElementById('app').innerHTML='<div class="card"><div class="profile"><div><div class="avatar">'+esc(initials)+'</div><h2>'+esc(name)+'</h2><p>'+esc(s.student_code)+'</p></div><div><h1>Student Profile</h1><p class="muted">Jetpur Karate Team</p><div class="grid"><div class="item"><small>Current Belt</small><b>'+esc(s.belt||'-')+'</b></div><div class="item"><small>Status</small><b>'+esc(s.status||'-')+'</b></div><div class="item"><small>Batch</small><b>'+esc(batch)+'</b></div><div class="item"><small>Admission Date</small><b>'+esc(s.admission_date||'-')+'</b></div><div class="item"><small>Mobile</small><b>'+esc(s.mobile||'-')+'</b></div><div class="item"><small>Email</small><b>'+esc(s.email||'-')+'</b></div><div class="item"><small>Date of Birth</small><b>'+esc(s.date_of_birth||'-')+'</b></div><div class="item"><small>Gender</small><b>'+esc(s.gender||'-')+'</b></div><div class="item"><small>Address</small><b>'+esc(s.address||'-')+'</b></div><div class="item"><small>Emergency Contact</small><b>'+esc(s.emergency_contact_name||'-')+' '+esc(s.emergency_contact_mobile||'')+'</b></div></div></div></div></div><div class="cards" style="margin-top:18px"><div class="card">Belt Promotions<br><b>'+belts.filter(x=>String(x.student_id||x.student)===String(s.id)).length+'</b></div><div class="card">Exams<br><b>'+exams.filter(x=>String(x.student_id||x.student)===String(s.id)).length+'</b></div><div class="card">Tournaments<br><b>'+tournaments.filter(x=>String(x.student_id||x.student)===String(s.id)).length+'</b></div><div class="card">Certificates<br><b>'+certs.filter(x=>String(x.student_id||x.student)===String(s.id)).length+'</b></div></div>'}</script></body></html>
