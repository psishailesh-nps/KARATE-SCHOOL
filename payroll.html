<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Payroll - Jetpur Karate Team ERP</title><link rel="stylesheet" href="assets/css/style.css"><style>
.page{padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd;border-radius:8px}.btn{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;border-radius:14px;padding:22px;max-width:760px;width:100%;max-height:90vh;overflow:auto}.actions{display:flex;gap:6px}.badge{padding:4px 8px;border-radius:12px;background:#eee;font-size:12px}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="page">
<div class="page-title"><div><h1>Coach Payroll</h1><p class="muted">Manage coach salary, payments and pending payroll.</p></div><button class="btn primary" onclick="openForm()">+ Add Payroll</button></div>
<div class="cards"><div class="card">Total Payroll<br><b id="total">₹0</b></div><div class="card">Paid<br><b id="paid">₹0</b></div><div class="card">Pending<br><b id="pending">₹0</b></div><div class="card">This Month<br><b id="month">₹0</b></div></div>
<div class="panel"><div class="toolbar"><input id="search" placeholder="Search coach, payroll no..." oninput="render()"><select id="filter" onchange="render()"><option>All</option><option>Paid</option><option>Pending</option><option>Partial</option><option>Cancelled</option></select><button class="btn" onclick="window.print()">Print</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Payroll No.</th><th>Coach</th><th>Period</th><th>Salary</th><th>Paid</th><th>Method</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="formTitle">Add Payroll</h2><input type="hidden" id="eid"><div class="formgrid">
<div class="field"><label>Coach *</label><select id="coach"></select></div><div class="field"><label>Salary Period</label><input id="period" placeholder="e.g. September 2026"></div>
<div class="field"><label>Payment Date</label><input id="date" type="date"></div><div class="field"><label>Salary Amount *</label><input id="salary" type="number" min="0" step="0.01"></div>
<div class="field"><label>Paid Amount</label><input id="paidamt" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Payment Method</label><select id="method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Other</option></select></div>
<div class="field"><label>Status</label><select id="status"><option>Pending</option><option>Partial</option><option>Paid</option><option>Cancelled</option></select></div><div class="field"><label>Reference No.</label><input id="ref"></div>
<div class="field full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div></div><div class="toolbar"><button class="btn primary" onclick="save()">Save</button><button class="btn" onclick="closeForm()">Cancel</button></div></div></div>
<script>
const KEY='jkt_payroll',$=id=>document.getElementById(id),arr=()=>JSON.parse(localStorage.getItem(KEY)||'[]'),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function coaches(){let a=JSON.parse(localStorage.getItem('jkt_coaches')||'[]');$('coach').innerHTML='<option value="">Select Coach</option>'+a.filter(x=>x.status!=='Inactive').map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name||x.coach_name||'Coach')+'</option>').join('')}
function seed(){if(arr().length)return;let c=JSON.parse(localStorage.getItem('jkt_coaches')||'[]');if(!c.length)return;localStorage.setItem(KEY,JSON.stringify([{id:Date.now(),payroll_no:'PAY-0001',coach:c[0].id,period:new Date().toLocaleString('en-IN',{month:'long',year:'numeric'}),date:new Date().toISOString().slice(0,10),salary:15000,paidamt:15000,method:'Bank Transfer',status:'Paid',ref:'',notes:'Demo payroll'}]))}
function openForm(id){coaches();$('modal').style.display='flex';$('formTitle').textContent=id?'Edit Payroll':'Add Payroll';$('eid').value=id||'';let x=arr().find(a=>String(a.id)===String(id));$('coach').value=x?.coach||'';$('period').value=x?.period||'';$('date').value=x?.date||new Date().toISOString().slice(0,10);$('salary').value=x?.salary||'';$('paidamt').value=x?.paidamt||0;$('method').value=x?.method||'Cash';$('status').value=x?.status||'Pending';$('ref').value=x?.ref||'';$('notes').value=x?.notes||''}
function closeForm(){$('modal').style.display='none'}
function save(){if(!$('coach').value||!$('salary').value)return alert('Coach and salary amount are required.');let salary=Number($('salary').value),paid=Number($('paidamt').value||0),status=$('status').value;if(status!=='Cancelled')status=paid>=salary?'Paid':paid>0?'Partial':'Pending';let a=arr(),id=$('eid').value,old=id&&a.find(z=>String(z.id)===id),x={id:id?Number(id):Date.now(),payroll_no:old?.payroll_no||'PAY-'+String(a.length+1).padStart(4,'0'),coach:$('coach').value,period:$('period').value,date:$('date').value,salary,paidamt:paid,method:$('method').value,status,ref:$('ref').value.trim(),notes:$('notes').value.trim()};if(id)a[a.findIndex(z=>String(z.id)===id)]=x;else a.unshift(x);localStorage.setItem(KEY,JSON.stringify(a));closeForm();render()}
function del(id){if(confirm('Delete this payroll record?')){localStorage.setItem(KEY,JSON.stringify(arr().filter(x=>String(x.id)!==String(id))));render()}}
function coachName(id){let a=JSON.parse(localStorage.getItem('jkt_coaches')||'[]'),x=a.find(c=>String(c.id)===String(id));return x?.name||x?.coach_name||'Unknown Coach'}
function render(){let a=arr(),q=$('search').value.toLowerCase(),f=$('filter').value,list=a.filter(x=>(f==='All'||x.status===f)&&JSON.stringify(x).toLowerCase().includes(q)),paid=a.filter(x=>x.status!=='Cancelled').reduce((s,x)=>s+Number(x.paidamt||0),0),salary=a.filter(x=>x.status!=='Cancelled').reduce((s,x)=>s+Number(x.salary||0),0),pending=a.filter(x=>x.status!=='Cancelled').reduce((s,x)=>s+Math.max(0,Number(x.salary||0)-Number(x.paidamt||0)),0),ym=new Date().toISOString().slice(0,7);$('total').textContent='₹'+salary.toLocaleString('en-IN');$('paid').textContent='₹'+paid.toLocaleString('en-IN');$('pending').textContent='₹'+pending.toLocaleString('en-IN');$('month').textContent='₹'+a.filter(x=>x.status!=='Cancelled'&&x.date?.slice(0,7)===ym).reduce((s,x)=>s+Number(x.paidamt||0),0).toLocaleString('en-IN');$('rows').innerHTML=list.map(x=>'<tr><td>'+esc(x.payroll_no)+'</td><td><b>'+esc(coachName(x.coach))+'</b></td><td>'+esc(x.period||'-')+'</td><td>₹'+Number(x.salary||0).toLocaleString('en-IN')+'</td><td>₹'+Number(x.paidamt||0).toLocaleString('en-IN')+'</td><td>'+esc(x.method)+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td><div class="actions"><button class="btn" onclick="openForm('+x.id+')">Edit</button><button class="btn danger" onclick="del('+x.id+')">Delete</button></div></td></tr>').join('')||'<tr><td colspan="8">No payroll records found.</td></tr>'}
coaches();seed();render();window.addEventListener('storage',()=>{coaches();render()});
</script></body></html>
