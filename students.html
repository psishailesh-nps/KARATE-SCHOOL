<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students - Jetpur Karate Team</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><div class="content" style="max-width:1200px;margin:auto">
<div class="page-title"><div><h2>Students</h2><div class="muted">Complete Local Storage Add / Edit / Delete</div></div><button class="btn btn-primary" style="width:auto" onclick="openStudent()">+ Add Student</button></div>
<div id="msg"></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search by name, ID or mobile..." oninput="render()"><select id="status" onchange="render()"><option value="">All Status</option><option>Active</option><option>Inactive</option><option>Pending</option></select></div>
<table class="table"><thead><tr><th>ID</th><th>Student</th><th>Mobile</th><th>Batch</th><th>Belt</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div id="modal" class="login hide" style="position:fixed;inset:0;background:#0008"><div class="login-card" style="max-width:650px"><h2 id="modalTitle">Add Student</h2><input type="hidden" id="id">
<div class="cards" style="grid-template-columns:1fr 1fr">
<div class="field"><label>First Name *</label><input id="first_name"></div><div class="field"><label>Last Name</label><input id="last_name"></div>
<div class="field"><label>Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Date of Birth</label><input type="date" id="date_of_birth"></div>
<div class="field"><label>Mobile</label><input id="mobile"></div><div class="field"><label>Email</label><input id="email" type="email"></div>
<div class="field"><label>Admission Date</label><input type="date" id="admission_date"></div><div class="field"><label>Belt</label><select id="belt"><option>White Belt</option><option>Yellow Belt</option><option>Orange Belt</option><option>Green Belt</option><option>Blue Belt</option><option>Brown Belt</option><option>Black Belt</option></select></div>
<div class="field"><label>Batch</label><select id="batch_id"></select></div><div class="field"><label>Status</label><select id="student_status"><option>Active</option><option>Inactive</option><option>Pending</option></select></div></div>
<div class="field"><label>Address</label><input id="address"></div><div class="field"><label>Emergency Contact Name</label><input id="emergency_contact_name"></div><div class="field"><label>Emergency Contact Mobile</label><input id="emergency_contact_mobile"></div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="closeStudent()">Cancel</button><button class="btn btn-primary" style="width:auto" onclick="saveStudent()">Save Student</button></div></div></div>
<script>
const SKEY='jkt_students',BKEY='jkt_batches';let students=[],batches=[];const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function init(){students=JSON.parse(localStorage.getItem(SKEY)||'[]');batches=JSON.parse(localStorage.getItem(BKEY)||'null');if(!Array.isArray(batches)||!batches.length){batches=[{id:1,code:'BAT-001',name:'Morning A',days:'Mon, Wed, Fri',start_time:'06:00',end_time:'07:00',coach:'',capacity:30,status:'Active',notes:''},{id:2,code:'BAT-002',name:'Evening A',days:'Mon, Wed, Fri',start_time:'18:00',end_time:'19:00',coach:'',capacity:30,status:'Active',notes:''},{id:3,code:'BAT-003',name:'Morning B',days:'Tue, Thu, Sat',start_time:'07:00',end_time:'08:00',coach:'',capacity:30,status:'Active',notes:''},{id:4,code:'BAT-004',name:'Evening B',days:'Tue, Thu, Sat',start_time:'19:00',end_time:'20:00',coach:'',capacity:30,status:'Active',notes:''}];localStorage.setItem(BKEY,JSON.stringify(batches))}if(!students.length){students=[{id:1,student_code:'ST-1001',first_name:'Aarav',last_name:'Patel',gender:'Male',date_of_birth:'',mobile:'9876543210',email:'',address:'',admission_date:'2026-01-10',batch_id:1,belt:'White Belt',emergency_contact_name:'',emergency_contact_mobile:'',status:'Active'},{id:2,student_code:'ST-1002',first_name:'Riya',last_name:'Shah',gender:'Female',date_of_birth:'',mobile:'9876543211',email:'',address:'',admission_date:'2026-01-12',batch_id:2,belt:'Yellow Belt',emergency_contact_name:'',emergency_contact_mobile:'',status:'Active'}];localStorage.setItem(SKEY,JSON.stringify(students))}}
function batchName(id){return (batches.find(b=>String(b.id)===String(id))||{}).name||'-'}
function render(){let q=$('search').value.toLowerCase(),st=$('status').value;let list=students.filter(s=>(!q||(s.student_code+' '+s.first_name+' '+(s.last_name||'')+' '+(s.mobile||'')).toLowerCase().includes(q))&&(!st||s.status===st));$('rows').innerHTML=list.map(s=>'<tr><td>'+esc(s.student_code)+'</td><td><b>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</b></td><td>'+esc(s.mobile||'')+'</td><td>'+esc(batchName(s.batch_id))+'</td><td>'+esc(s.belt||'')+'</td><td><span class="badge">'+esc(s.status||'')+'</span></td><td><button class="btn" onclick="location.href='student-profile.html?id='+s.id">Profile</button> <button class="btn" onclick="editStudent('+s.id+')">Edit</button> <button class="btn" onclick="deleteStudent('+s.id+')">Delete</button></td></tr>').join('')||'<tr><td colspan="7">No students found.</td></tr>'}
function fillBatches(selected=''){batches=JSON.parse(localStorage.getItem(BKEY)||'[]');$('batch_id').innerHTML='<option value="">Select batch</option>'+batches.filter(b=>b.status!=='Inactive').map(b=>'<option value="'+b.id+'">'+esc(b.name)+' ('+esc(b.code)+')</option>').join('');$('batch_id').value=selected||''}
function openStudent(){ $('modalTitle').innerText='Add Student';$('id').value='';['first_name','last_name','date_of_birth','mobile','email','address','emergency_contact_name','emergency_contact_mobile'].forEach(x=>$(x).value='');$('admission_date').value=new Date().toISOString().slice(0,10);$('gender').value='';$('belt').value='White Belt';$('student_status').value='Active';fillBatches();$('modal').classList.remove('hide')}
function editStudent(id){let s=students.find(x=>x.id===id);if(!s)return;openStudent();$('modalTitle').innerText='Edit Student';$('id').value=s.id;['first_name','last_name','date_of_birth','mobile','email','address','emergency_contact_name','emergency_contact_mobile'].forEach(x=>$(x).value=s[x]||'');$('gender').value=s.gender||'';$('belt').value=s.belt||'White Belt';$('student_status').value=s.status||'Active';$('admission_date').value=s.admission_date||'';fillBatches(s.batch_id)}
function closeStudent(){$('modal').classList.add('hide')}
function saveStudent(){let id=Number($('id').value),old=students.find(x=>x.id===id),first=$('first_name').value.trim();if(!first){alert('First name is required');return}let s={id:id||Date.now(),student_code:old?.student_code||('ST-'+String(Date.now()).slice(-6)),first_name:first,last_name:$('last_name').value.trim(),gender:$('gender').value,date_of_birth:$('date_of_birth').value,mobile:$('mobile').value.trim(),email:$('email').value.trim(),address:$('address').value.trim(),admission_date:$('admission_date').value,batch_id:$('batch_id').value,belt:$('belt').value,emergency_contact_name:$('emergency_contact_name').value.trim(),emergency_contact_mobile:$('emergency_contact_mobile').value.trim(),status:$('student_status').value};if(id)students=students.map(x=>x.id===id?s:x);else students.push(s);localStorage.setItem(SKEY,JSON.stringify(students));closeStudent();notice(id?'Student updated successfully':'Student added successfully');render()}
function deleteStudent(id){let s=students.find(x=>x.id===id);if(s&&confirm('Delete '+s.first_name+' '+(s.last_name||'')+'?')){students=students.filter(x=>x.id!==id);localStorage.setItem(SKEY,JSON.stringify(students));notice('Student deleted successfully');render()}}
function notice(t){$('msg').innerHTML='<div class="card" style="margin-bottom:12px">'+esc(t)+'</div>';setTimeout(()=>{$('msg').innerHTML=''},2500)}
window.addEventListener('storage',()=>{init();render()});init();render();
</script></body></html>
