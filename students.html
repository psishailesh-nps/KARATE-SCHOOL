<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students - Jetpur Karate Team</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body>
<div class="content" style="max-width:1200px;margin:auto">
<div class="page-title"><div><h2>Students</h2><div class="muted">Complete Add / Edit / Delete student management</div></div><button class="btn btn-primary" style="width:auto" onclick="openStudent()">+ Add Student</button></div>
<div class="card"><div class="toolbar"><input id="search" placeholder="Search by name, ID or mobile..." oninput="loadStudents()"><select id="status" onchange="loadStudents()"><option value="">All Status</option><option>Active</option><option>Inactive</option><option>Pending</option></select></div>
<table class="table"><thead><tr><th>ID</th><th>Student</th><th>Mobile</th><th>Batch</th><th>Belt</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<div id="modal" class="login hide" style="position:fixed;inset:0;background:#0008">
<div class="login-card" style="max-width:650px"><h2 id="modalTitle">Add Student</h2>
<input type="hidden" id="id">
<div class="cards" style="grid-template-columns:1fr 1fr">
<div class="field"><label>First Name</label><input id="first_name"></div><div class="field"><label>Last Name</label><input id="last_name"></div>
<div class="field"><label>Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Date of Birth</label><input type="date" id="date_of_birth"></div>
<div class="field"><label>Mobile</label><input id="mobile"></div><div class="field"><label>Email</label><input id="email"></div>
<div class="field"><label>Admission Date</label><input type="date" id="admission_date"></div><div class="field"><label>Belt</label><select id="belt"><option>White Belt</option><option>Yellow Belt</option><option>Orange Belt</option><option>Green Belt</option><option>Blue Belt</option><option>Brown Belt</option><option>Black Belt</option></select></div>
<div class="field"><label>Batch</label><select id="batch_id"><option value="">Select batch</option><option value="1">Morning A</option><option value="2">Evening A</option><option value="3">Morning B</option><option value="4">Evening B</option></select></div><div class="field"><label>Status</label><select id="student_status"><option>Active</option><option>Inactive</option><option>Pending</option></select></div>
</div><div class="field"><label>Address</label><input id="address"></div><div class="field"><label>Emergency Contact Name</label><input id="emergency_contact_name"></div><div class="field"><label>Emergency Contact Mobile</label><input id="emergency_contact_mobile"></div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="closeStudent()">Cancel</button><button class="btn btn-primary" style="width:auto" onclick="saveStudent()">Save Student</button></div>
</div></div>
<script>
let data=JSON.parse(localStorage.getItem('jkt_students')||'[]');
function seed(){if(data.length)return;data=[{id:1,student_code:'ST-1001',first_name:'Aarav',last_name:'Patel',mobile:'9876543210',batch_id:1,batch:'Morning A',belt:'White Belt',status:'Active'},{id:2,student_code:'ST-1002',first_name:'Riya',last_name:'Shah',mobile:'9876543211',batch_id:2,batch:'Evening A',belt:'Yellow Belt',status:'Active'}];localStorage.setItem('jkt_students',JSON.stringify(data))}
function loadStudents(){seed();let q=(document.getElementById('search').value||'').toLowerCase(),st=document.getElementById('status').value;let list=data.filter(s=>(!q||(s.student_code+' '+s.first_name+' '+s.last_name+' '+s.mobile).toLowerCase().includes(q))&&(!st||s.status===st));document.getElementById('rows').innerHTML=list.map(s=>'<tr><td>'+s.student_code+'</td><td><b>'+s.first_name+' '+(s.last_name||'')+'</b></td><td>'+s.mobile+'</td><td>'+s.batch+'</td><td>'+s.belt+'</td><td><span class="badge">'+s.status+'</span></td><td><button class="btn" onclick="editStudent('+s.id+')">Edit</button> <button class="btn" onclick="deleteStudent('+s.id+')">Delete</button></td></tr>').join('')||'<tr><td colspan="7">No students found.</td></tr>'}
function openStudent(){document.getElementById('modalTitle').innerText='Add Student';document.getElementById('id').value='';['first_name','last_name','date_of_birth','mobile','email','address','emergency_contact_name','emergency_contact_mobile'].forEach(x=>document.getElementById(x).value='');document.getElementById('modal').classList.remove('hide')}
function editStudent(id){let s=data.find(x=>x.id===id);if(!s)return;openStudent();document.getElementById('modalTitle').innerText='Edit Student';document.getElementById('id').value=s.id;['first_name','last_name','date_of_birth','mobile','email','address','emergency_contact_name','emergency_contact_mobile'].forEach(x=>document.getElementById(x).value=s[x]||'');document.getElementById('gender').value=s.gender||'';document.getElementById('belt').value=s.belt;document.getElementById('batch_id').value=s.batch_id||'';document.getElementById('student_status').value=s.status}
function closeStudent(){document.getElementById('modal').classList.add('hide')}
function saveStudent(){let id=Number(document.getElementById('id').value),batchEl=document.getElementById('batch_id'),batch=batchEl.options[batchEl.selectedIndex]?.text||'';let s={id:id||Date.now(),student_code:id?(data.find(x=>x.id===id)||{}).student_code:'ST-'+String(Date.now()).slice(-6),first_name:document.getElementById('first_name').value.trim(),last_name:document.getElementById('last_name').value.trim(),gender:document.getElementById('gender').value,date_of_birth:document.getElementById('date_of_birth').value,mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),address:document.getElementById('address').value.trim(),admission_date:document.getElementById('admission_date').value,batch_id:batchEl.value,batch:batch,belt:document.getElementById('belt').value,emergency_contact_name:document.getElementById('emergency_contact_name').value.trim(),emergency_contact_mobile:document.getElementById('emergency_contact_mobile').value.trim(),status:document.getElementById('student_status').value};if(!s.first_name){alert('First name is required');return}if(id)data=data.map(x=>x.id===id?s:x);else data.push(s);localStorage.setItem('jkt_students',JSON.stringify(data));closeStudent();loadStudents()}
function deleteStudent(id){let s=data.find(x=>x.id===id);if(!s)return;if(confirm('Delete '+s.first_name+' '+(s.last_name||'')+'?')){data=data.filter(x=>x.id!==id);localStorage.setItem('jkt_students',JSON.stringify(data));loadStudents()}}
loadStudents();
</script></body></html>
