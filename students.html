<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students - Jetpur Karate Team</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><div class="content" style="max-width:1200px;margin:auto">
<div class="page-title"><div><h2>Students</h2><div class="muted">Live PHP/MySQL Add / Edit / Delete</div></div><button class="btn btn-primary" style="width:auto" onclick="openStudent()">+ Add Student</button></div>
<div id="msg"></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search by name, ID or mobile..." oninput="loadStudents()"><select id="status" onchange="loadStudents()"><option value="">All Status</option><option>Active</option><option>Inactive</option><option>Pending</option></select></div>
<table class="table"><thead><tr><th>ID</th><th>Student</th><th>Mobile</th><th>Batch</th><th>Belt</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div id="modal" class="login hide" style="position:fixed;inset:0;background:#0008"><div class="login-card" style="max-width:650px"><h2 id="modalTitle">Add Student</h2><input type="hidden" id="id">
<div class="cards" style="grid-template-columns:1fr 1fr">
<div class="field"><label>First Name *</label><input id="first_name"></div><div class="field"><label>Last Name</label><input id="last_name"></div>
<div class="field"><label>Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Date of Birth</label><input type="date" id="date_of_birth"></div>
<div class="field"><label>Mobile</label><input id="mobile"></div><div class="field"><label>Email</label><input id="email" type="email"></div>
<div class="field"><label>Admission Date</label><input type="date" id="admission_date"></div><div class="field"><label>Belt</label><select id="belt"><option>White Belt</option><option>Yellow Belt</option><option>Orange Belt</option><option>Green Belt</option><option>Blue Belt</option><option>Brown Belt</option><option>Black Belt</option></select></div>
<div class="field"><label>Batch ID</label><input id="batch_id" type="number"></div><div class="field"><label>Status</label><select id="student_status"><option>Active</option><option>Inactive</option><option>Pending</option></select></div></div>
<div class="field"><label>Address</label><input id="address"></div><div class="field"><label>Emergency Contact Name</label><input id="emergency_contact_name"></div><div class="field"><label>Emergency Contact Mobile</label><input id="emergency_contact_mobile"></div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="closeStudent()">Cancel</button><button class="btn btn-primary" style="width:auto" onclick="saveStudent()">Save Student</button></div></div></div>
<script>
const API='api/students.php';let students=[];const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notice(t){$('msg').innerHTML='<div class="card" style="margin-bottom:12px">'+esc(t)+'</div>';setTimeout(()=>{$('msg').innerHTML=''},3000)}
async function request(url,options={}){const r=await fetch(url,options);const j=await r.json().catch(()=>({success:false,message:'Invalid API response'}));if(!r.ok||!j.success)throw new Error(j.message||'Request failed');return j}
async function loadStudents(){try{const q=encodeURIComponent($('search').value||''),st=encodeURIComponent($('status').value||'');const j=await request(API+'?q='+q+'&status='+st);students=j.data||[];$('rows').innerHTML=students.map(s=>'<tr><td>'+esc(s.student_code)+'</td><td><b>'+esc((s.first_name||'')+' '+(s.last_name||''))+'</b></td><td>'+esc(s.mobile||'')+'</td><td>'+esc(s.batch_name||s.batch_id||'-')+'</td><td>'+esc(s.belt||'')+'</td><td><span class="badge">'+esc(s.status||'')+'</span></td><td><button class="btn" onclick="editStudent('+s.id+')">Edit</button> <button class="btn" onclick="deleteStudent('+s.id+')">Delete</button></td></tr>').join('')||'<tr><td colspan="7">No students found.</td></tr>'}catch(e){$('rows').innerHTML='<tr><td colspan="7">API connection failed. Configure api/config.php first.</td></tr>';notice(e.message)}}
function openStudent(){ $('modalTitle').innerText='Add Student';$('id').value='';['first_name','last_name','date_of_birth','mobile','email','address','emergency_contact_name','emergency_contact_mobile','batch_id'].forEach(x=>$(x).value='');$('admission_date').value=new Date().toISOString().slice(0,10);$('gender').value='';$('belt').value='White Belt';$('student_status').value='Active';$('modal').classList.remove('hide')}
function editStudent(id){const s=students.find(x=>Number(x.id)===Number(id));if(!s)return;openStudent();$('modalTitle').innerText='Edit Student';$('id').value=s.id;['first_name','last_name','date_of_birth','mobile','email','address','emergency_contact_name','emergency_contact_mobile','batch_id'].forEach(x=>$(x).value=s[x]??'');$('gender').value=s.gender||'';$('belt').value=s.belt||'White Belt';$('student_status').value=s.status||'Active';$('admission_date').value=s.admission_date||''}
function closeStudent(){$('modal').classList.add('hide')}
function payload(){return {id:Number($('id').value)||undefined,first_name:$('first_name').value.trim(),last_name:$('last_name').value.trim(),gender:$('gender').value,date_of_birth:$('date_of_birth').value,mobile:$('mobile').value.trim(),email:$('email').value.trim(),address:$('address').value.trim(),admission_date:$('admission_date').value,batch_id:$('batch_id').value,belt:$('belt').value,emergency_contact_name:$('emergency_contact_name').value.trim(),emergency_contact_mobile:$('emergency_contact_mobile').value.trim(),status:$('student_status').value}}
async function saveStudent(){const p=payload();if(!p.first_name){alert('First name is required');return}try{const id=$('id').value;await request(API,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});closeStudent();notice(id?'Student updated successfully':'Student added successfully');loadStudents()}catch(e){alert(e.message)}}
async function deleteStudent(id){const s=students.find(x=>Number(x.id)===Number(id));if(!s||!confirm('Delete '+s.first_name+' '+(s.last_name||'')+'?'))return;try{await request(API+'?id='+id,{method:'DELETE'});notice('Student deleted successfully');loadStudents()}catch(e){alert(e.message)}}
loadStudents();
</script></body></html>
