<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student / Parent Portal - Jetpur Karate Team</title><link rel="stylesheet" href="assets/css/style.css"><style>
.page{padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.badge{padding:4px 8px;border-radius:12px;background:#eee;font-size:12px}.loginbox{max-width:430px;margin:70px auto}.field{margin:12px 0}.field label{display:block;font-weight:600;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:8px}.btn{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{padding:9px 13px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer}.tabs button.active{background:#2563eb;color:#fff}.muted{color:#667085}
</style></head><body><div id="app"></div>
<script>
const $=id=>document.getElementById(id),students=()=>JSON.parse(localStorage.getItem('jkt_students')||'[]'),fees=()=>JSON.parse(localStorage.getItem('jkt_fees')||'[]'),attendance=()=>JSON.parse(localStorage.getItem('jkt_attendance')||'{}'),promos=()=>JSON.parse(localStorage.getItem('jkt_belt_promotions')||'[]'),exams=()=>JSON.parse(localStorage.getItem('jkt_exams')||'[]'),tournaments=()=>JSON.parse(localStorage.getItem('jkt_tournaments')||'[]'),certs=()=>JSON.parse(localStorage.getItem('jkt_certificates')||'[]'),notices=()=>JSON.parse(localStorage.getItem('jkt_notices_events')||'[]');
let sid=localStorage.getItem('jkt_student_portal_id')||'',tab='overview';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function login(){ $('app').innerHTML='<div class="card loginbox"><h2>🥋 Student / Parent Portal</h2><p class="muted">Enter your Student ID and registered mobile number.</p><div class="field"><label>Student ID</label><input id="studentId" placeholder="ST-1001"></div><div class="field"><label>Mobile</label><input id="mobile" placeholder="Registered mobile"></div><button class="btn primary" onclick="doLogin()">Login</button><p id="err" style="color:#b42318"></p></div>'}
function doLogin(){let id=$('studentId').value.trim().toLowerCase(),m=$('mobile').value.trim(),s=students().find(x=>String(x.student_code).toLowerCase()===id&&String(x.mobile||'')===m);if(!s){$('err').textContent='Student ID or mobile number is incorrect.';return}sid=s.id;localStorage.setItem('jkt_student_portal_id',sid);tab='overview';render()}
function logout(){localStorage.removeItem('jkt_student_portal_id');sid='';render()}
function current(){return students().find(x=>String(x.id)===String(sid))}
function batchName(id){let b=JSON.parse(localStorage.getItem('jkt_batches')||'[]').find(x=>String(x.id)===String(id));return b?.name||'-'}
function render(){let s=current();if(!s){login();return}let name=(s.first_name||'')+' '+(s.last_name||''),f=fees().filter(x=>String(x.student_id||x.student)===String(s.id)),p=promos().filter(x=>String(x.student_id||x.student)===String(s.id)),e=exams().filter(x=>String(x.student_id||x.student)===String(s.id)),t=tournaments().filter(x=>String(x.student_id||x.student)===String(s.id)),c=certs().filter(x=>String(x.student_id||x.student)===String(s.id));$('app').innerHTML='<div class="page"><div class="page-title"><div><h1>Welcome, '+esc(name)+'</h1><div class="muted">Student / Parent Portal</div></div><button class="btn" onclick="logout()">Logout</button></div><div class="cards"><div class="card">Student ID<br><b>'+esc(s.student_code)+'</b></div><div class="card">Current Belt<br><b>'+esc(s.belt||'-')+'</b></div><div class="card">Batch<br><b>'+esc(batchName(s.batch_id))+'</b></div><div class="card">Certificates<br><b>'+c.length+'</b></div></div><div class="tabs"><button class="'+(tab==='overview'?'active':'')+'" onclick="tab='overview';render()">Overview</button><button class="'+(tab==='fees'?'active':'')+'" onclick="tab='fees';render()">Fees</button><button class="'+(tab==='attendance'?'active':'')+'" onclick="tab='attendance';render()">Attendance</button><button class="'+(tab==='belt'?'active':'')+'" onclick="tab='belt';render()">Belt History</button><button class="'+(tab==='exams'?'active':'')+'" onclick="tab='exams';render()">Exams</button><button class="'+(tab==='tournaments'?'active':'')+'" onclick="tab='tournaments';render()">Tournaments</button><button class="'+(tab==='certificates'?'active':'')+'" onclick="tab='certificates';render()">Certificates</button><button class="'+(tab==='notices'?'active':'')+'" onclick="tab='notices';render()">Notices</button></div><div class="panel">'+content(s,f,p,e,t,c)+'</div></div>'}
function content(s,f,p,e,t,c){if(tab==='overview')return '<h2>Profile</h2><table class="table"><tr><th>Name</th><td>'+esc(s.first_name+' '+(s.last_name||''))+'</td></tr><tr><th>Mobile</th><td>'+esc(s.mobile||'-')+'</td></tr><tr><th>Admission Date</th><td>'+esc(s.admission_date||'-')+'</td></tr><tr><th>Status</th><td>'+esc(s.status||'-')+'</td></tr><tr><th>Belt</th><td>'+esc(s.belt||'-')+'</td></tr></table><h2>Recent Updates</h2><p>Fees: '+f.length+' records &nbsp; | &nbsp; Exams: '+e.length+' &nbsp; | &nbsp; Tournaments: '+t.length+' &nbsp; | &nbsp; Certificates: '+c.length+'</p>';if(tab==='fees')return '<h2>Fee History</h2>'+tbl(f,['fee_period','date','total_amount','paid','status']);if(tab==='attendance'){let a=attendance(),rows=[];Object.keys(a).sort().reverse().forEach(d=>{let v=a[d]?.[s.id];if(v)rows.push({date:d,status:v})});return '<h2>Attendance</h2>'+tbl(rows,['date','status'])}if(tab==='belt')return '<h2>Belt Promotion History</h2>'+tbl(p,['promotion_date','previous_belt','new_belt','exam','coach','score']);if(tab==='exams')return '<h2>Exam / Grading Records</h2>'+tbl(e,['exam_name','date','current_belt','target_belt','marks','result','remarks']);if(tab==='tournaments')return '<h2>Tournament Achievements</h2>'+tbl(t,['tournament_name','date','event','result','position','location']);if(tab==='certificates')return '<h2>Certificates</h2>'+tbl(c,['certificate_no','certificate_title','type','date','achievement']);if(tab==='notices'){let n=notices().filter(x=>x.status==='Published'&&x.audience!=='Coaches').sort((a,b)=>String(b.date).localeCompare(String(a.date)));return '<h2>Academy Notices & Events</h2>'+tbl(n,['type','title','date','time','venue','message'])}}
function tbl(data,cols){if(!data.length)return '<p class="muted">No records available.</p>';return '<div style="overflow:auto"><table class="table"><tr>'+cols.map(c=>'<th>'+esc(c.replaceAll('_',' '))+'</th>').join('')+'</tr>'+data.map(x=>'<tr>'+cols.map(c=>'<td>'+esc(x[c]??'-')+'</td>').join('')+'</tr>').join('')+'</table></div>'}
render();
</script></body></html>
